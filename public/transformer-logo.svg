<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vibrantMetal" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/> <!-- Cyan 400 -->
      <stop offset="50%" stop-color="#3b82f6"/> <!-- Blue 500 -->
      <stop offset="100%" stop-color="#7c3aed"/> <!-- Violet 600 -->
    </linearGradient>
    <linearGradient id="darkMetal" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/> <!-- Slate 800 -->
      <stop offset="100%" stop-color="#0f172a"/> <!-- Slate 900 -->
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Central Forehead Wedge -->
  <path d="M256 30 L160 80 L180 140 H332 L352 80 L256 30 Z" fill="url(#vibrantMetal)" stroke="#020617" stroke-width="4"/>
  
  <!-- Forehead Triangle Cutout -->
  <path d="M256 80 L220 110 H292 L256 80 Z" fill="#020617"/>

  <!-- Left Brow -->
  <path d="M150 90 L80 120 L90 200 L160 230 L170 150 L150 90 Z" fill="url(#darkMetal)" stroke="url(#vibrantMetal)" stroke-width="3"/>
  <!-- Right Brow -->
  <path d="M362 90 L432 120 L422 200 L352 230 L342 150 L362 90 Z" fill="url(#darkMetal)" stroke="url(#vibrantMetal)" stroke-width="3"/>

  <!-- Left Cheek/Faceplate -->
  <path d="M160 240 L90 260 L100 380 L180 420 L190 320 L160 240 Z" fill="url(#vibrantMetal)" stroke="#020617" stroke-width="3"/>
  <!-- Right Cheek/Faceplate -->
  <path d="M352 240 L422 260 L412 380 L332 420 L322 320 L352 240 Z" fill="url(#vibrantMetal)" stroke="#020617" stroke-width="3"/>

  <!-- Nose Bridge -->
  <path d="M230 150 H282 V300 H230 V150 Z" fill="url(#darkMetal)" stroke="url(#vibrantMetal)" stroke-width="3"/>

  <!-- Mouthplate / Chin -->
  <path d="M256 480 L190 430 V330 H230 V400 H282 V330 H322 V430 L256 480 Z" fill="url(#darkMetal)" stroke="url(#vibrantMetal)" stroke-width="4"/>

  <!-- Eyes (Glowing) -->
  <path d="M180 260 L220 270 V300 L180 290 Z" fill="#22d3ee" filter="url(#neonGlow)"/>
  <path d="M332 260 L292 270 V300 L332 290 Z" fill="#22d3ee" filter="url(#neonGlow)"/>

  <!-- Detail Lines -->
  <path d="M100 140 L150 160" stroke="#22d3ee" stroke-width="4"/>
  <path d="M412 140 L362 160" stroke="#22d3ee" stroke-width="4"/>
</svg>
